<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60" shape-rendering="crispEdges" role="img" aria-label="Tina, morceguinha pixelada, batendo asa">
<style>
  #tina{ animation: flutua .34s steps(1) infinite; }
  @keyframes flutua{ 0%,49.9%{ transform:translateY(1.5px); } 50%,100%{ transform:translateY(-1.5px); } }
  .wing-up{ animation: asas .34s steps(1) infinite; }
  .wing-down{ animation: asas .34s steps(1) infinite; }
  @keyframes asas{ 0%,49.9%{ opacity:1; } 50%,100%{ opacity:0; } }
  .wing-down{ animation-delay: .17s; }
</style>
<g id="tina">
  <g class="wing-up"><rect x="24" y="20" width="8" height="16" fill="#1b1622"/><rect x="16" y="12" width="8" height="24" fill="#1b1622"/><rect x="8" y="8" width="8" height="24" fill="#1b1622"/><rect x="4" y="8" width="4" height="16" fill="#120e18"/><rect x="48" y="20" width="8" height="16" fill="#1b1622"/><rect x="56" y="12" width="8" height="24" fill="#1b1622"/><rect x="64" y="8" width="8" height="24" fill="#1b1622"/><rect x="72" y="8" width="4" height="16" fill="#120e18"/></g>
  <g class="wing-down" style="opacity:0"><rect x="24" y="32" width="8" height="16" fill="#1b1622"/><rect x="16" y="32" width="8" height="20" fill="#1b1622"/><rect x="8" y="36" width="8" height="20" fill="#1b1622"/><rect x="4" y="40" width="4" height="16" fill="#120e18"/><rect x="48" y="32" width="8" height="16" fill="#1b1622"/><rect x="56" y="32" width="8" height="20" fill="#1b1622"/><rect x="64" y="36" width="8" height="20" fill="#1b1622"/><rect x="72" y="40" width="4" height="16" fill="#120e18"/></g>
  <rect x="24" y="4" width="4" height="4" fill="#241d2b"/><rect x="24" y="8" width="8" height="4" fill="#241d2b"/><rect x="28" y="8" width="4" height="4" fill="#c86b7a"/><rect x="52" y="4" width="4" height="4" fill="#241d2b"/><rect x="48" y="8" width="8" height="4" fill="#241d2b"/><rect x="48" y="8" width="4" height="4" fill="#c86b7a"/><rect x="24" y="12" width="32" height="24" fill="#241d2b"/><rect x="28" y="12" width="12" height="4" fill="#362c40"/><rect x="28" y="20" width="8" height="8" fill="#f4f1e8"/><rect x="44" y="20" width="8" height="8" fill="#f4f1e8"/><rect x="32" y="24" width="4" height="4" fill="#ff3b21"/><rect x="44" y="24" width="4" height="4" fill="#ff3b21"/><rect x="36" y="28" width="8" height="4" fill="#e08a96"/><rect x="32" y="36" width="16" height="16" fill="#241d2b"/><rect x="36" y="40" width="8" height="12" fill="#4a3a44"/><rect x="36" y="44" width="4" height="4" fill="#c86b7a"/><rect x="32" y="32" width="16" height="4" fill="#4d2733"/><rect x="32" y="32" width="4" height="4" fill="#f4f1e8"/><rect x="44" y="32" width="4" height="4" fill="#f4f1e8"/><rect x="32" y="52" width="8" height="4" fill="#120e18"/><rect x="40" y="52" width="8" height="4" fill="#120e18"/>
</g>
</svg>