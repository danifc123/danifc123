name: Agatha - teia nos commits

on:
  schedule:
    - cron: "17 6 * * *" # todo dia as 03:17 (America/Sao_Paulo)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-teia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar SVG com os commits reais
        env:
          GH_LOGIN: danifc123
        run: node scripts/generate-web-svg.mjs

      - name: Commitar se mudou
        run: |
          git config user.name "agatha-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/agatha-teia-commits.svg assets/agatha-teia-commits-dark.svg
          if git diff --cached --quiet; then
            echo "Sem mudanca nos commits de hoje, nada pra commitar."
          else
            git commit -m "chore: atualiza teia da Agatha com os commits do dia"
            git push
          fi
